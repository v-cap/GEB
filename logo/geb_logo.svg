<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">GEB logo</title>
  <desc id="desc">Logo do Grupo de Estudos em Biomecatrônica, com elementos de cérebro, circuitos e tecnologia assistiva.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#eff9ff"/>
      <stop offset="100%" stop-color="#f6f9fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a5db4"/>
      <stop offset="100%" stop-color="#29c7ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#1ebc73"/>
      <stop offset="100%" stop-color="#7eed5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0a3d74" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <text x="600" y="430" text-anchor="middle" font-size="240" font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="url(#blue)" letter-spacing="-8">GEB</text>
    <text x="600" y="560" text-anchor="middle" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0a5db4" letter-spacing="7">GRUPO DE ESTUDOS EM BIOMECATRÔNICA</text>

    <g transform="translate(150,100)">
      <circle cx="0" cy="0" r="16" fill="#2fd2ff"/>
      <circle cx="42" cy="-26" r="10" fill="#4de39b"/>
      <circle cx="82" cy="28" r="10" fill="#2fd2ff"/>
      <path d="M0 0 L42 -26 L82 28" fill="none" stroke="#2fd2ff" stroke-width="6" stroke-linecap="round"/>
      <path d="M42 -26 L100 -36" fill="none" stroke="#51e3ff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g transform="translate(970,120)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#0a5db4" stroke-width="6"/>
      <circle cx="0" cy="0" r="18" fill="#dffcff" stroke="#0a5db4" stroke-width="4"/>
      <circle cx="-28" cy="0" r="8" fill="#2fd2ff"/>
      <circle cx="28" cy="0" r="8" fill="#4de39b"/>
      <circle cx="0" cy="-28" r="8" fill="#2fd2ff"/>
      <circle cx="0" cy="28" r="8" fill="#4de39b"/>
      <path d="M0 0 L28 0 M0 0 L0 -28 M0 0 L-28 0 M0 0 L0 28" stroke="#0a5db4" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
